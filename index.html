<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CetherOS轻量系统官网</title>
    <!-- 简单美化 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 24px;
        }
        a {
            display: inline‑block;
            color: #58a6ff;
            border: 1px solid #58a6ff;
            padding: 10px 24px;
            border‑radius: 6px;
            text‑decoration: none;
            transition: 0.2s;
        }
        a:hover {
            background-color: #58a6ff;
            color: #0d1117;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>👋 Hello，欢迎来到CetherOS官网</h1>
        <p>这是CetherOS的官方网站</p>
        <p>开发者个人是一名准初三生，开学后学业较紧，有可能只有等到初中毕业后才更新</p>
        <a href="https://github.com/CetherOS" target="_blank">访问我的 GitHub</a>
    </div>
</body>
</html>
