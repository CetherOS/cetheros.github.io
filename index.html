<!DOCTYPE html>
<html lang="en_US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CetherOS Lightweight System Official Website</title>
    <!-- 简单美化 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .box {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            margin-bottom: 16px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 24px;
        }
        a {
            display: inline‑block;
            color: #58a6ff;
            border: 1px solid #58a6ff;
            padding: 10px 24px;
            border‑radius: 6px;
            text‑decoration: none;
            transition: 0.2s;
        }
        a:hover {
            background-color: #58a6ff;
            color: #0d1117;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hi,welcome to the official website of CetherOS.</h1>
        <p>This is the official website of CetherOS.</p>
        <p>The developer is an incoming ninth‑grader. Due to heavy academic workload after the start of the school term, updates may only be available after graduating from junior high school.</p>
        <a href="https://github.com/CetherOS" target="_blank">Download</a>
    </div>
</body>
</html>
